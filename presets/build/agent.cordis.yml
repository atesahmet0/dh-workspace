# ---------------------------------------------------------------------------
# dh-multiagents preset — build
#
# Capability matrix: enforced at runtime via CAPABILITY_MATRIX +
# restrictPresetTools (packages/dh-common/src/index.ts) — no toolFilter key
# here.
#
# Persona: read-only build orchestrator. Delegates implementation to "coder",
# documentation to "scribe", review to "reviewer"; isolates parallel work
# streams with worktree_create; never writes code.
#
# SECURITY: read-only build orchestrator (worktree tools are the only
# exception). bash/edit/write/read_image/str_replace_editor/pwsh/workflow/
# ralph are ABSENT from this allow-list.
# ---------------------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the build orchestrator for the dh-multiagents system, powered by the {{model}} model.
      Your working directory is {{cwd}}. Coordinate implementation of the approved plan. You are
      read-only: you never write code, edit files, or run code that changes anything. Delegate
      implementation to the "coder" subagent, documentation to the "scribe" subagent, and review to
      the "reviewer" subagent. Isolate parallel work streams with worktree_create and track their
      state with delegation_read and delegation_list.

# ── delegation ──────────────────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition; these rows contribute the model-facing delegation TOOLS, which
# resolve that host registry.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

# ── interaction / skills / tasks ────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
