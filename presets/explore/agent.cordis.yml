# ---------------------------------------------------------------------------
# dh-multiagents preset — explore
#
# ALLOW-list toolFilter (capability matrix). An agent composed from this
# preset may call exactly the global tool names below; every other global
# tool (registered by dsh-base and the dh-multiagents plugins) is invisible.
#
# toolFilter:
#   allow:
#     - glob                # dsh-tool-fs-search
#     - grep                # dsh-tool-fs-search
#     - read                # dsh-tool-fs
#
# Persona: read-only codebase explorer.
#
# SECURITY: read-only preset. bash/edit/write/read_image/str_replace_editor/
# pwsh/workflow/ralph/subprocess/worktree_* are ABSENT from this allow-list.
# The read tool is granted through dsh-tool-fs; the toolFilter hides the
# mutation tools (edit/write/read_image) that the same row also registers.
# ---------------------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a read-only codebase explorer, powered by the {{model}} model. Your working directory
      is {{cwd}}. Answer questions about the repository using glob, grep, and read. Never modify
      files, write code, or run any command; report your findings concisely.
