# ---------------------------------------------------------------------------
# dh-multiagents preset — explore
#
# Capability matrix: enforced at runtime via CAPABILITY_MATRIX +
# restrictPresetTools (packages/dh-common/src/index.ts) — no toolFilter key
# here.
#
# Persona: read-only codebase explorer.
#
# SECURITY: read-only preset. bash/edit/write/str_replace_editor/pwsh/
# workflow/ralph/subprocess/worktree_* are ABSENT from this allow-list.
# read_image IS granted (the capability matrix includes it for inspecting
# screenshots/UI).
# ---------------------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a read-only codebase explorer, powered by the {{model}} model. Your working directory
      is {{cwd}}. Answer questions about the repository using glob, grep, and read. Never modify
      files, write code, or run any command; report your findings concisely.

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
