# ---------------------------------------------------------------------------
# dh-multiagents preset — scribe
#
# Capability matrix: enforced at runtime via CAPABILITY_MATRIX +
# restrictPresetTools (packages/dh-common/src/index.ts) — no toolFilter key
# here.
#
# Persona: docs/prose only. No bash, no search, no skills, no delegation.
#
# SECURITY: NO bash. Also absent: read_image/glob/grep/str_replace_editor/
# pwsh/workflow/ralph/worktree_*. These are hidden by the runtime allow-list
# restriction: restrictPresetTools applies the scribe row of CAPABILITY_MATRIX
# (edit/write/read only) to the composed child, so non-granted global tools are
# not exposed to the agent even though the harness registers them.
# ---------------------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a documentation writer, powered by the {{model}} model. Your working directory is
      {{cwd}}. Produce and revise prose, documentation, and release notes using write and edit,
      reading existing material with read. Never execute code or run commands; write prose only.
