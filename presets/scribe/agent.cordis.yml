# ---------------------------------------------------------------------------
# dh-multiagents preset — scribe
#
# ALLOW-list toolFilter (capability matrix). An agent composed from this
# preset may call exactly the global tool names below; every other global
# tool (registered by dsh-base and the dh-multiagents plugins) is invisible.
#
# toolFilter:
#   allow:
#     - edit                # dsh-tool-fs
#     - write               # dsh-tool-fs
#     - read                # dsh-tool-fs
#
# Persona: docs/prose only. No bash, no search, no skills, no delegation.
#
# SECURITY: NO bash. Also absent: read_image/glob/grep/str_replace_editor/
# pwsh/workflow/ralph/worktree_*. The toolFilter hides the non-granted tools
# that dsh-tool-fs also registers (read_image).
# ---------------------------------------------------------------------------

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a documentation writer, powered by the {{model}} model. Your working directory is
      {{cwd}}. Produce and revise prose, documentation, and release notes using write and edit,
      reading existing material with read. Never execute code or run commands; write prose only.
