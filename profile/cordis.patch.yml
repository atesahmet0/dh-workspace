# dh-multiagents profile patch layer — Phase 9.
#
# Rows here override bundle rows by id (a patch replaces the WHOLE config of a
# targeted row; later layers win). Layer order:
#   bundle patches -> this file -> $DSH_HOME/cordis.patch.yml -> --patch
#
# This layer holds USER-PLANE overrides: paths and values that depend on where
# this profile and its bundles are installed. `!!js` expressions are evaluated
# with globals: process, injected ctx.<service>, dshHomePath(...), baseUrl
# (baseUrl = the profile directory).

# ── skills: owned by the bundle layer ─────────────────────────────────────────
#
# The @dh-multiagents/bundle patch (cordis.patch.yml) now overrides the
# skill-filesystem row (bundledSkillDir → the installed dh-philosophy package),
# so this profile layer no longer needs to wire skills.

# ── user-plane override examples (commented, for the deployment owner) ───────
#
# - id: dh-workspace
#   config:
#     # plan storage root, routing rules (all keys optional)
#
# - id: dh-delegation
#   config:
#     # delegation backend knobs
#
# - id: dh-subagent-preset
#   config:
#     # preset -> provider bindings
#
# - id: dh-worktree
#   config:
#     # worktree root policy
#
# - id: agent-presets
#   config:
#     default: plan        # change the default preset for new sessions
#     roots:
#       - path: <absolute-or-~-expanded-path-to-presets>
#         trust: system
